# Optional but recommended. Runs checks before each commit, on your machine:
#   pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files # blocks datasets / weights committed by mistake
        args: ["--maxkb=1000"]
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/kynan/nbstripout # removes notebook outputs -> no merge conflicts
    rev: 0.8.1
    hooks:
      - id: nbstripout

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff
        files: ^ai-services/
      - id: ruff-format
        files: ^ai-services/
