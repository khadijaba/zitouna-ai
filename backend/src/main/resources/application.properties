spring.application.name=zitouna-backend
server.port=8080

# --- Database (PostgreSQL). Override with env vars in Docker / CI. ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/zitouna}
spring.datasource.username=${DB_USER:zitouna}
spring.datasource.password=${DB_PASSWORD:zitouna}
# Schema is owned by Flyway (src/main/resources/db/migration). Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Uploads (leaf photos, parcel images) ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Security ---
# HS256 secret, at least 32 characters. NEVER commit a real one: set JWT_SECRET in .env.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-at-least-32-chars}
app.jwt.expiration=PT24H
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}
# First admin of the back-office (/admin in the app). Empty = no admin created.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# --- AI services (one FastAPI container per module, see docs/api-contract.md) ---
app.ai.timeout=PT30S
app.ai.disease-url=${AI_M1_URL:http://localhost:8001}
app.ai.irrigation-url=${AI_M2_URL:http://localhost:8002}
app.ai.yield-url=${AI_M3_URL:http://localhost:8003}
app.ai.price-url=${AI_M4_URL:http://localhost:8004}
app.ai.assistant-url=${AI_M5_URL:http://localhost:8005}
# The farmer waits in the chat: if M5 takes longer, the chat asks to clarify instead.
app.ai.assistant-timeout=${AI_M5_TIMEOUT:PT3S}
# LLM that writes the chat replies (M5 /answer, rotation across free APIs). Off or failing -> template replies.
app.ai.llm-enabled=${AI_LLM_ENABLED:true}
app.ai.llm-timeout=${AI_LLM_TIMEOUT:PT15S}
app.ai.trees-url=${AI_M6_URL:http://localhost:8006}

# --- Ops ---
management.endpoints.web.exposure.include=health,info
