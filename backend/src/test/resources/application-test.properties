# Tests run on in-memory H2 (PostgreSQL mode) so CI and teammates don't need a database.
spring.datasource.url=jdbc:h2:mem:zitouna;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
app.jwt.secret=test-secret-test-secret-test-secret-123
